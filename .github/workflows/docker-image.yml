name: Docker Image CI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag thechef3179/ml-model-inference:latest
        docker tag thechef3179/ml-model-inference:latest thechef3179/ml-model-inference:$(date +'%y.%m.%d')
    
    - name: Push the Docker image
      run: |
        docker push thechef3179/ml-model-inference:latest
        docker push thechef3179/ml-model-inference:$(date +'%y.%m.%d')
